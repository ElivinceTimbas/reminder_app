name: reminder_app
description: "A single-user reminder list: recurring or one-shot, backed by sqflite and OS local notifications."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  auto_route: ^11.2.0
  sqflite: ^2.4.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1
  file_picker: ^13.1.0
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/OFL.txt

  fonts:
    - family: SourGummy
      fonts:
        - asset: assets/fonts/SourGummy.ttf



flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/bell.png"
